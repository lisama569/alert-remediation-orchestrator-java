# ===== 告警自动处置编排服务（本地模拟）配置 =====
# 随机端口启动，便于本地并行验证；需要固定端口可改为 8080。
server.port=${SERVER_PORT:0}

# 手动时钟起点（仅文档/默认）。业务时间只由 TimeService 管理：
# 生产装配为 ManualClockService，默认起点 2026-09-25T00:00:00Z，
# 只能通过 POST /api/clock/advance?seconds=n 推进，不依赖任何真实等待。
remediation.clock.start=2026-09-25T00:00:00Z

# 可重试失败的退避间隔（秒），当前为引擎常量 RemediationService.RETRY_BACKOFF=1s；
# 重试唤醒由手动时钟在推进到 due 时刻时触发。
remediation.retry.backoff-seconds=1

# 维护窗口 / 变更冻结边界统一采用半开区间 [start,end)：
# 恰好在 end 时刻触发视为窗口/冻结已结束（边界判定确定、可复现）。
